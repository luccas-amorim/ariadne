name: Conferir acervo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install Markdown==3.11.3
      - run: python ferramentas/livros.py --conferir
      - name: Conferir o inventário com a revisão anterior
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            python ferramentas/acervo.py --base "$BASE"
          else
            python ferramentas/acervo.py
          fi
