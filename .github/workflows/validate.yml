name: Validar dados

on:
  push:
    paths:
      - "docs/data/**"
      - "docs/js/data.js"
      - "docs/js/graphdata.js"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "docs/data/**"
      - "docs/js/data.js"
      - "docs/js/graphdata.js"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validar catálogo e diplomas
        run: node scripts/validate.js
      - name: Conferir se os arquivos gerados estão em dia
        run: node scripts/build-graph.js --check
