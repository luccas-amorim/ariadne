<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linha do tempo da filosofia</title>
<meta name="description" content="Linha do tempo da filosofia, de Tales ao século XXI, por correntes, influências e áreas.">
<meta property="og:title" content="Linha do tempo da filosofia">
<meta property="og:description" content="Linha do tempo da filosofia, de Tales ao século XXI, por correntes, influências e áreas.">
<meta property="og:type" content="website">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mapa.css">
<link rel="stylesheet" href="../../ariadne.css">
</head>
<body>
<header class="cabeca">
  <div>
    <h1>Linha do tempo da filosofia</h1>
    <p class="sub">De Tales ao século XXI, por correntes, influências e áreas</p>
  </div>
  <div class="ferramentas">
    <input id="busca" type="search" list="nomes" placeholder="Buscar filósofo" aria-label="Buscar filósofo" autocomplete="off">
    <datalist id="nomes"></datalist>
    <div class="zoom" role="group" aria-label="Aproximação">
      <button type="button" id="menos" aria-label="Afastar">−</button>
      <output id="nivel">100%</output>
      <button type="button" id="mais" aria-label="Aproximar">+</button>
    </div>
    <button type="button" id="enquadrar" class="enquadrar">Ver o mapa inteiro</button>
    <a class="enquadrar" href="../problemas/" target="_top">Ver por problemas</a>
  </div>
</header>

<nav class="seletores" aria-label="Filtros">
  <div class="grupo" id="periodos" role="group" aria-label="Período"><span class="rotulo">Período</span></div>
  <div class="grupo" id="niveis" role="group" aria-label="Agrupamento das correntes"><span class="rotulo">Correntes</span></div>
  <div class="grupo areas" id="areas" role="group" aria-label="Área"><span class="rotulo">Área</span></div>
</nav>

<div class="faixa">
  <span id="contagem"></span>
  <span class="leg"><svg width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="currentColor" stroke-width="2.4"/></svg>mestre e discípulo</span>
  <span class="leg"><svg width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="currentColor" stroke-width="1"/></svg>influência</span>
  <span class="leg"><svg width="26" height="8" aria-hidden="true"><line x1="0" y1="4" x2="26" y2="4" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/></svg>crítica ou reação</span>
  <label><input type="checkbox" id="todas"> Mostrar todas as influências</label>
  <details id="detalhes">
    <summary>Como ler</summary>
    <div class="como-ler" id="comoLer"></div>
  </details>
</div>

<main class="palco">
  <div id="rolagem" class="rolagem">
    <svg id="eixo" aria-label="Eixo do tempo"></svg>
    <svg id="mapa" role="group" aria-label="Mapa de filósofos e correntes"></svg>
    <div id="vazio" class="vazio" hidden></div>
  </div>
  <aside id="ficha" class="ficha" hidden aria-live="polite"></aside>
</main>
<div id="dica" class="dica" role="tooltip"></div>
<script src="../dados/filosofos.js"></script>
<script src="../dados/catalogo.js"></script>
<script src="correntes.js"></script>
<script src="mapa.js"></script>
<script src="../../ariadne.js" data-home="../../" data-trail="Filosofia=../|Linha do tempo da filosofia"></script>
</body>
</html>
