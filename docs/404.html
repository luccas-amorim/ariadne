<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariadne — página não encontrada</title>
    <meta name="robots" content="noindex">
    <script>
        // IRIs estáveis (…/ariadne/id/cc/parte-geral) não são arquivos: o GitHub Pages
        // responde com esta página, que leva ao nó correspondente na árvore.
        (function () {
            var m = location.pathname.match(/^(.*?\/)id\/([a-z0-9\/-]+?)\/?$/i);
            if (m) location.replace(m[1] + '#/' + m[2].toLowerCase());
        })();
    </script>
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #334155; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
        @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } }
        main { max-width: 28rem; padding: 1.5rem; text-align: center; }
        a { color: inherit; }
    </style>
</head>
<body>
    <main>
        <h1>Página não encontrada</h1>
        <p>O endereço não corresponde a uma página nem a um nó do Ariadne. <a href="/ariadne/">Voltar ao mapa</a>.</p>
    </main>
</body>
</html>
